# Reading collection. Add a new entry to the top of this list to feature a new read.
- title: "The Aerodynamics Doctrine"
  author: ""
  type: "Essay"
  url: "https://docs.google.com/document/d/1mwXAKEMJllacvKM6OAUpFiNBcxKwBAX-odIKctEUycc/mobilebasic"
  summary: "A sharp breakdown of why the agency model is a \"hollow engine\" that is being replaced by scalable, software-encoded expertise."
