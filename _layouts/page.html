---
layout: default
---
<article class="page-content">
  <header class="page-heading">
    {% if page.kicker %}
      <p class="eyebrow">{{ page.kicker }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="page-summary">{{ page.summary }}</p>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
